<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgriRent Machinery - GraphQL Demo</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 30px; background-color: #f7fafc; color: #2d3748; }
    h1 { color: #276749; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    th { background: #edf2f7; color: #4a5568; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-avail { background: #c6f6d5; color: #22543d; }
    .badge-booked { background: #fed7d7; color: #742a2a; }
    input, select, button { padding: 10px; margin: 5px 0; border: 1px solid #cbd5e0; border-radius: 5px; font-size: 14px; }
    button { background: #2f855a; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #276749; }
    .form-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>

  <h1>🚜 AgriRent Equipment Catalogue (GraphQL API)</h1>

  <div class="card">
    <h3>Add New Agricultural Machinery (Mutation)</h3>
    <form id="addEquipmentForm" class="form-group">
      <input type="text" id="name" placeholder="Machine Name (e.g. Sonalika Tractor)" required style="flex: 2;">
      <input type="text" id="category" placeholder="Category (e.g. Harvesting)" required style="flex: 1;">
      <input type="number" id="daily_rate" placeholder="Rent / Day (₹)" required style="flex: 1;">
      <select id="is_available" style="flex: 1;">
        <option value="true">Available</option>
        <option value="false">Booked</option>
      </select>
      <button type="submit">Submit Mutation</button>
    </form>
  </div>

  <div class="card">
    <h3>Live Machinery Inventory (Query Result)</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Equipment Name</th>
          <th>Category</th>
          <th>Daily Rate (₹)</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="equipmentTableBody">
        <tr><td colspan="5">Loading equipment catalog...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
   const GRAPHQL_ENDPOINT = 'http://localhost:4000/';
  
    async function fetchEquipments() {
      const query = `
        query {
          equipments {
            id
            name
            category
            daily_rate
            is_available
          }
        }
      `;

      const response = await fetch(GRAPHQL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });

      const { data } = await response.json();
      renderTable(data.equipments);
    }

    function renderTable(items) {
      const tbody = document.getElementById('equipmentTableBody');
      tbody.innerHTML = '';
      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>#${item.id}</td>
          <td><strong>${item.name}</strong></td>
          <td>${item.category}</td>
          <td>₹${item.daily_rate.toFixed(2)}</td>
          <td>
            <span class="badge ${item.is_available ? 'badge-avail' : 'badge-booked'}">
              ${item.is_available ? 'AVAILABLE' : 'BOOKED'}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

   
    document.getElementById('addEquipmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const category = document.getElementById('category').value;
      const daily_rate = parseFloat(document.getElementById('daily_rate').value);
      const is_available = document.getElementById('is_available').value === 'true';

      const mutation = `
        mutation AddEquipment($input: AddEquipmentInput!) {
          addEquipment(input: $input) {
            id
            name
            daily_rate
          }
        }
      `;

      await fetch(GRAPHQL_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: mutation,
          variables: { input: { name, category, daily_rate, is_available } }
        })
      });

      // Reset form and re-query
      document.getElementById('addEquipmentForm').reset();
      await fetchEquipments();
    });

    // Initial load
    fetchEquipments();
  </script>
</body>
</html>
