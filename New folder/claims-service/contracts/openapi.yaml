openapi: 3.0.3
info:
  title: AgriRent Claims, Disputes & Reviews Microservice API
  version: 1.0.0
  description: |
    Service 6 of the AgriRent SOA Architecture.
    Responsible for evidence capture, damage claims against security deposits,
    peer disputes, adjuster decisions, completed rental peer reviews, and the
    settlement saga hand-off closing out security deposits with Payment Service.

    ### Architectural Policies & Assumptions
    - **Dispute Hold Policy (DISPUTE_HOLD_POLICY=BLOCK_SETTLEMENT)**:
      While a damage claim is in `SUBMITTED` status or any dispute is in `OPEN` status,
      the security deposit is strictly BLOCKED from settlement. Settlement only occurs
      once every claim has been decided by an administrator and no disputes remain open,
      or when the owner waives damage claims early.
    - **Role Assumptions & Authorization**:
      - **OWNER**: Files damage claims against the renter's deposit; submits peer reviews; waives claims.
      - **RENTER**: Files disputes against damage claims; submits peer reviews.
      - **ADMIN**: Evaluates damage claims, decides approved deduction amounts, and resolves disputes.
      - **INTERNAL_SERVICE**: Authorized internal caller via `x-internal-service-token` for `GET /approved-deductions`.
      - Unauthorized non-participants receive `403 NOT_PARTICIPANT`.

servers:
  - url: http://localhost:4006
    description: Local Development / Docker Server

paths:
  # ============================================================================
  # CLAIMS
  # ============================================================================
  /v1/bookings/{bookingId}/claims:
    post:
      summary: Submit a damage claim against the rental deposit
      operationId: SubmitDamageClaim
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
          example: BK-TEST-001
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          example: idemp-claim-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitClaimRequest'
      responses:
        '201':
          description: Claim created successfully in SUBMITTED state
          headers:
            Idempotency-Key:
              schema:
                type: string
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '409':
          $ref: '#/components/responses/409Error'
        '429':
          $ref: '#/components/responses/429Error'

  /v1/claims/{claimId}:
    get:
      summary: Get details of a damage claim
      operationId: GetClaim
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
          example: CLM-12345678
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Claim details
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '304':
          description: Not Modified
        '401':
          $ref: '#/components/responses/401Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '406':
          $ref: '#/components/responses/406Error'

  /v1/claims:
    get:
      summary: List damage claims with cursor pagination
      operationId: ListClaims
      parameters:
        - name: bookingId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [SUBMITTED, APPROVED, PARTIALLY_APPROVED, REJECTED, SETTLED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated claims
          headers:
            Link:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimsListResponse'

  /v1/claims/{claimId}/evidence-items:
    post:
      summary: Add evidence photos/notes to an active claim
      operationId: AddEvidenceItem
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: string
                notes:
                  type: string
      responses:
        '201':
          description: Evidence added successfully
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '409':
          $ref: '#/components/responses/409Error'

  /v1/claims/{claimId}/events:
    get:
      summary: Get timeline event history for a claim
      operationId: GetClaimEvents
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated timeline events

  # ============================================================================
  # DISPUTES
  # ============================================================================
  /v1/claims/{claimId}/disputes:
    post:
      summary: Raise a dispute against an owner claim (Renter only)
      operationId: RaiseDispute
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                evidence:
                  type: object
      responses:
        '201':
          description: Dispute opened
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '409':
          $ref: '#/components/responses/409Error'

  /v1/disputes/{disputeId}:
    get:
      summary: Get dispute status and decision
      operationId: GetDisputeStatus
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Dispute details
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/DisputeResponse'
        '304':
          description: Not Modified
        '404':
          $ref: '#/components/responses/404Error'

  /v1/disputes:
    get:
      summary: List disputes
      operationId: ListDisputes
      responses:
        '200':
          description: Paginated disputes

  # ============================================================================
  # DECISIONS
  # ============================================================================
  /v1/claims/{claimId}/decisions:
    post:
      summary: Decide claim and approved deduction amount (Admin only)
      operationId: ReviewDamageClaim
      parameters:
        - name: claimId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, PARTIALLY_APPROVED, REJECTED]
                approvedAmount:
                  type: number
                reason:
                  type: string
      responses:
        '200':
          description: Decision recorded and open disputes resolved
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '409':
          $ref: '#/components/responses/409Error'
        '422':
          $ref: '#/components/responses/422Error'

  # ============================================================================
  # REVIEWS
  # ============================================================================
  /v1/bookings/{bookingId}/reviews:
    post:
      summary: Submit peer rental review
      operationId: SubmitReview
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId, rating, feedback]
              properties:
                targetUserId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                feedback:
                  type: string
      responses:
        '201':
          description: Review published
        '400':
          $ref: '#/components/responses/400Error'
        '403':
          $ref: '#/components/responses/403Error'
        '409':
          $ref: '#/components/responses/409Error'

  /v1/reviews:
    get:
      summary: List reviews
      operationId: ListReviews
      responses:
        '200':
          description: Paginated reviews
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60

  /v1/reviews/{reviewId}:
    get:
      summary: Get review details
      operationId: GetReview
      responses:
        '200':
          description: Review details
        '404':
          $ref: '#/components/responses/404Error'

  /v1/users/{userId}/review-summary:
    get:
      summary: Aggregated review summary for a user
      operationId: GetReviewSummary
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review summary

  # ============================================================================
  # SETTLEMENT & WAIVERS
  # ============================================================================
  /v1/bookings/{bookingId}/claim-waivers:
    post:
      summary: Waive damage claims to expedite settlement (Owner only)
      operationId: WaiveClaimWindow
      responses:
        '200':
          description: Window waived

  /v1/bookings/{bookingId}/approved-deductions:
    get:
      summary: Get approved deductions for settlement reconciliation (Internal only)
      operationId: GetApprovedDeductions
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
        - name: internal_service_token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Approved deductions
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, no-cache, must-revalidate, private
        '403':
          $ref: '#/components/responses/403Error'

  /v1/bookings/{bookingId}/settlement-requests:
    post:
      summary: Request security deposit settlement
      operationId: RequestSettlement
      responses:
        '202':
          description: Settlement request queued
        '409':
          $ref: '#/components/responses/409Error'

  /v1/bookings/{bookingId}/settlement-status:
    get:
      summary: Get settlement status and eligibility
      operationId: GetSettlementStatus
      responses:
        '200':
          description: Settlement status

  # ============================================================================
  # GRAPHQL OPERATION
  # ============================================================================
  /graphql:
    post:
      summary: GraphQL read-only queries with DataLoader batching
      operationId: GraphQLQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: "query { claim(id: \"CLM-1234\") { claimId status claimedAmount evidence { evidenceId } } }"
                variables:
                  type: object
                operationName:
                  type: string
      responses:
        '200':
          description: GraphQL query results (errors array returned on resolver failures)
        '400':
          description: GraphQL syntax, parse, or depth limit validation error
        '401':
          $ref: '#/components/responses/401Error'
        '429':
          $ref: '#/components/responses/429Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubmitClaimRequest:
      type: object
      required: [reason, claimedAmount, evidence]
      properties:
        reason:
          type: string
          example: Cracked hydraulic hose during operation
        claimedAmount:
          type: number
          example: 150.00
        evidence:
          type: object
          required: [photos]
          properties:
            photos:
              type: array
              items:
                type: string
              example: ["https://storage.agrirent.in/claims/hose-crack.jpg"]
            notes:
              type: string
              example: Leak identified immediately at return

    ClaimResponse:
      type: object
      properties:
        claimId:
          type: string
          example: CLM-A1B2C3D4
        bookingId:
          type: string
          example: BK-TEST-001
        status:
          type: string
          example: SUBMITTED
        claimedAmount:
          type: number
          example: 150.00
        windowClosesAt:
          type: string

    ClaimsListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClaimResponse'
        hasMore:
          type: boolean
        nextCursor:
          type: string

    DisputeResponse:
      type: object
      properties:
        disputeId:
          type: string
          example: DSP-B2C3D4E5
        claimId:
          type: string
        status:
          type: string
          example: OPEN
        reason:
          type: string

    StandardError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              example: INVALID_CLAIM
            message:
              type: string
              example: Claim window has closed.
            correlationId:
              type: string
              example: corr-7a1b2c3d4e5f
            details:
              type: array
              items:
                type: object

  responses:
    400Error:
      description: Bad Request / Schema Validation Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    401Error:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    403Error:
      description: Forbidden / Not Participant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    404Error:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    406Error:
      description: Not Acceptable Content Type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    409Error:
      description: Conflict / State Transition Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    422Error:
      description: Unprocessable Entity / Invalid Deduction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    429Error:
      description: Rate Limit Exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
